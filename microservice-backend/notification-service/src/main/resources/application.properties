spring.application.name=notification-service

server.port=9020

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

cloudcart.notification.mode=${CLOUDCART_NOTIFICATION_MODE:outbox}
cloudcart.notification.outbox-directory=${CLOUDCART_OUTBOX_DIR:../../.runtime/outbox}

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
