spring:
  application:
    name: user-service
  datasource:
    url: "jdbc:h2:file:${CLOUDCART_DATA_DIR:../../.runtime/data}/user-service;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 9050

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
